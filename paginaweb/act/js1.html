
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1: Saludo</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="distr">
        <header>
            <h1>Ejercicio 1: Saludo</h1>
        </header>
        <main>
            <section class="ejercicio-card">
                <p>Introduce tu nombre y pulsa el botón para ver el saludo.</p>
                <input id="nombreSaludo" type="text" placeholder="Escribe tu nombre">
                <button type="button" id="btnSaludar">Mostrar saludo</button>
                <p id="saludoResultado" class="resultado"></p>
                <a href="index.html">Volver al inicio</a>
            </section>
        </main>
        <footer>
            
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const nombreInput = document.getElementById('nombreSaludo');
            const saludoResultado = document.getElementById('saludoResultado');
            const btnSaludar = document.getElementById('btnSaludar');

            btnSaludar.addEventListener('click', () => {
                const nombre = nombreInput.value.trim();
                if (!nombre) {
                    saludoResultado.textContent = 'Por favor escribe tu nombre.';
                    return;
                }
                const mensaje = 'Hola, ' + nombre;
                console.log(mensaje);
                alert(mensaje);
                saludoResultado.textContent = mensaje;
            });
        });
    </script>
</body>
</html>
