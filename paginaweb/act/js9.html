
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 9: Número aleatorio</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="distr">
        <header>
            <h1>Ejercicio 9: Número aleatorio</h1>
        </header>
        <main>
            <section class="ejercicio-card">
                <button type="button" id="btnGenerarAleatorio">Generar número</button>
                <p id="resultadoAleatorio" class="resultado"></p>
                <a href="index.html">Volver al inicio</a>
            </section>
        </main>
        <footer>
            
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btnGenerarAleatorio = document.getElementById('btnGenerarAleatorio');
            const resultadoAleatorio = document.getElementById('resultadoAleatorio');

            btnGenerarAleatorio.addEventListener('click', () => {
                const aleatorio = Math.floor(Math.random() * 10) + 1;
                resultadoAleatorio.textContent = `Número aleatorio generado: ${aleatorio}`;
            });
        });
    </script>
</body>
</html>
