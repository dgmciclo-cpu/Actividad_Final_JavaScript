
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6: Parque de atracciones</title>
    <link rel="stylesheet" href="./css/index.css">
</head>
<body>
    <div class="distr">
        <header>
            <h1>Ejercicio 6: Parque de atracciones</h1>
        </header>
        <main>
            <section class="ejercicio-card">
                <div class="form-row">
                    <label for="edadPersona">Edad persona</label>
                    <input id="edadPersona" type="number" placeholder="Edad" min="0">
                </div>
                <div class="form-row">
                    <label for="edadAcompanante">Edad acompañante</label>
                    <input id="edadAcompanante" type="number" placeholder="Edad del acompañante" min="0">
                </div>
                <div class="form-row checkbox-row">
                    <label><input id="paseRapido" type="checkbox"> Pase rápido</label>
                </div>
                <div class="form-row checkbox-row">
                    <label><input id="autorizacionEspecial" type="checkbox"> Autorización especial</label>
                </div>
                <button type="button" id="btnEvaluarAcceso">Evaluar acceso</button>
                <p id="resultadoAcceso" class="resultado"></p>
                <a href="index.html">Volver al inicio</a>
            </section>
        </main>
        <footer>
            
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const edadPersonaInput = document.getElementById('edadPersona');
            const edadAcompananteInput = document.getElementById('edadAcompanante');
            const paseRapidoCheckbox = document.getElementById('paseRapido');
            const autorizacionCheckbox = document.getElementById('autorizacionEspecial');
            const btnEvaluarAcceso = document.getElementById('btnEvaluarAcceso');
            const resultadoAcceso = document.getElementById('resultadoAcceso');

            btnEvaluarAcceso.addEventListener('click', () => {
                const edad = parseInt(edadPersonaInput.value, 10);
                const edadAcompanante = parseInt(edadAcompananteInput.value, 10);
                const paseRapido = paseRapidoCheckbox.checked;
                const autorizacion = autorizacionCheckbox.checked;

                if (!Number.isFinite(edad) || edad < 0) {
                    resultadoAcceso.textContent = 'Introduce una edad válida para la persona.';
                    return;
                }

                let mensaje = '';
                if (edad < 5) {
                    mensaje = 'No puede entrar.';
                } else if (edad <= 12) {
                    if (Number.isFinite(edadAcompanante) && edadAcompanante > 18) {
                        mensaje = 'Puede entrar al parque con un adulto acompañante.';
                    } else {
                        mensaje = 'Puede entrar solo con un adulto acompañante de más de 18 años.';
                    }
                } else if (edad <= 60) {
                    mensaje = 'Puede entrar normalmente.';
                } else {
                    mensaje = autorizacion
                        ? 'Puede entrar con autorización especial.'
                        : 'Necesita autorización especial para entrar.';
                }

                if (paseRapido && mensaje.toLowerCase().includes('puede entrar')) {
                    mensaje += ' Además, puede saltarse la fila con pase rápido.';
                }

                resultadoAcceso.textContent = mensaje;
            });
        });
    </script>
</body>
</html>
